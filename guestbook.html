<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · TwitterArchiver</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css">
<style>
:root {
  --bg:         #f7f9f9;
  --bg-card:    #ffffff;
  --bg-hover:   #f0f3f4;
  --border:     #e6eaed;
  --text:       #0f1419;
  --text-dim:   #536471;
  --text-muted: #aab8c2;
  --accent:     #1d9bf0;

  /* Waline 覆盖 */
  --waline-theme-color:    var(--accent);
  --waline-active-color:   var(--accent);
  --waline-bg-color:       var(--bg-card);
  --waline-bg-color-hover: var(--bg-hover);
  --waline-color:          var(--text);
  --waline-border-color:   var(--border);
  --waline-border:         1px solid var(--border);
  --waline-bq-color:       var(--border);
  --waline-info-bg-color:  var(--bg-hover);
  --waline-info-color:     var(--text-dim);
  --waline-box-shadow:     none;
  --waline-border-radius:  10px;
  --waline-font-size:      15px;
}
body.dark {
  --bg:         #000000;
  --bg-card:    #0a0a0a;
  --bg-hover:   #111111;
  --border:     #2f3336;
  --text:       #e7e9ea;
  --text-dim:   #71767b;
  --text-muted: #3e4144;
}

/* ── 隐藏不需要的元素 ── */
.wl-power,
a[href*="rss"],
img.wl-user-avatar,
.wl-avatar,
.wl-user { display: none !important; }

/* 头像隐藏后，留言内容左对齐，无缩进 */
.wl-card { padding-left: 0 !important; }
.wl-item { padding-left: 0 !important; }

/* 去掉昵称框和评论框之间的虚线 */
.wl-header { border-bottom: none !important; }
.wl-editor  { border-top: none !important; }

/* 大外框：灰色细线 */
.wl-panel {
  border: 1px solid var(--border) !important;
  border-radius: 14px !important;
  padding: 16px !important;
  background: var(--bg-card) !important;
  box-shadow: none !important;
}

/* ── 输入区域（只有昵称，单列）── */
.wl-header {
  display: block !important;
  margin-bottom: 10px !important;
}
.wl-header-item {
  display: flex !important;
  flex-direction: column !important;
  gap: 4px !important;
}
.wl-header-item + .wl-header-item { display: none !important; }
.wl-header-item label {
  font-size: 12px !important;
  color: var(--text-dim) !important;
  font-weight: 500 !important;
}
.wl-header-item input {
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  padding: 10px 14px !important;
  font-size: 14px !important;
  border: none !important;
  border-radius: 10px !important;
  background: var(--bg-hover) !important;
  color: var(--text) !important;
  outline: none !important;
  transition: box-shadow .15s !important;
}
.wl-header-item input:focus {
  box-shadow: 0 0 0 2px var(--accent) !important;
}
.wl-editor {
  width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
  min-height: 110px !important;
  font-size: 15px !important;
  line-height: 1.6 !important;
  padding: 12px 14px !important;
  border: none !important;
  border-radius: 10px !important;
  background: var(--bg-hover) !important;
  color: var(--text) !important;
  outline: none !important;
  resize: vertical !important;
  transition: box-shadow .15s !important;
}
.wl-editor:focus {
  box-shadow: 0 0 0 2px var(--accent) !important;
}

/* 暗色模式显式覆盖（防止 Waline 自带样式干扰）*/
body.dark .wl-panel       { background: #0a0a0a !important; border-color: #2f3336 !important; }
body.dark .wl-header-item input { background: #111111 !important; color: #e7e9ea !important; }
body.dark .wl-editor      { background: #111111 !important; color: #e7e9ea !important; }
.wl-btn.primary {
  background: var(--accent) !important;
  border: none !important;
  border-radius: 8px !important;
  font-size: 14px !important;
  font-weight: 600 !important;
}
/* ── 留言列表 ── */
.wl-meta-head { font-size: 15px !important; font-weight: 700 !important; margin: 24px 0 16px !important; }
.wl-user { margin-left: 0 !important; }  /* 头像隐藏后内容左对齐 */
.wl-meta { font-size: 13px !important; }
.wl-badge { font-size: 11px !important; border-radius: 4px !important; }
.wl-actions { font-size: 13px !important; }
.wl-item { padding-left: 0 !important; }

@media (max-width: 480px) {
  .wl-header { grid-template-columns: 1fr !important; }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100vh;
  transition: background .25s, color .25s;
}

.theme-btn {
  position: fixed; top: 14px; right: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text); border-radius: 50%;
  width: 38px; height: 38px; font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.08); z-index: 99;
}

.header { max-width: 720px; margin: 0 auto; padding: 48px 24px 28px; }
.back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .83rem; color: var(--text-dim); text-decoration: none; margin-bottom: 24px;
}
.back:hover { color: var(--accent); }
.header h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
.header h1 span { color: var(--accent); }
.header p { font-size: .9rem; color: var(--text-dim); line-height: 1.6; }

.waline-wrap { max-width: 720px; margin: 0 auto; padding: 0 24px 80px; }

footer {
  text-align: center; padding: 18px 20px;
  font-size: .76rem; color: var(--text-muted);
  border-top: 1px solid var(--border);
}
footer a { color: var(--text-dim); text-decoration: none; }
footer a:hover { color: var(--accent); }
</style>
</head>
<body>

<button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>

<div class="header">
  <a class="back" href="./index.html">← 返回存档列表</a>
  <h1>留<span>言板</span></h1>
  <p>欢迎在此留下你的足迹</p>
</div>

<div class="waline-wrap">
  <div id="waline"></div>
</div>

<footer>
  <a href="./index.html">TwitterArchiver</a> ·
  <a href="https://github.com/TwitterArchiver" target="_blank">GitHub</a>
</footer>

<script>
const stored = localStorage.getItem('portal-theme');
let isDark = stored === 'dark';
applyTheme(isDark);
function applyTheme(dark) {
  isDark = dark;
  document.body.classList.toggle('dark', dark);
  document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('portal-theme', dark ? 'dark' : 'light');
}
function toggleTheme() { applyTheme(!isDark); }
</script>

<script type="module">
import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
init({
  el: '#waline',
  serverURL: 'https://waline-twitterarchiver.vercel.app',
  lang: 'zh-CN',
  login: 'disable',
  reaction: false,
  wordLimit: 0,
  pageSize: 20,
  placeholder: '留下你的话...',
  requiredMeta: ['nick'],
  meta: ['nick'],
  avatar: 'hide',
});
</script>

</body>
</html>
