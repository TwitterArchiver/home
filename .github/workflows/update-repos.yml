name: 更新仓库列表

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 03:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: 生成 repos.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo list TwitterArchiver --limit 200 --json name,description \
            --jq '.[] | select(
              .name != "Dispatcher" and
              .name != ".github" and
              .name != "home" and
              .name != "TwitterArchiver.github.io"
            ) | [.name, (.description // "")] | @tsv' \
            | sort | while IFS=$'\t' read -r REPO REPO_DESC; do
            [ -z "$REPO" ] && continue

            # 找 accounts/ 下的第一个账号子目录
            ACCOUNT_DIR=$(gh api "repos/TwitterArchiver/$REPO/contents/accounts" \
              --jq 'if type == "array" then .[0].name else "" end' 2>/dev/null || echo "")

            DISPLAY_NAME=""
            USERNAME=""
            if [ -n "$ACCOUNT_DIR" ]; then
              PROFILE=$(gh api \
                "repos/TwitterArchiver/$REPO/contents/accounts/$ACCOUNT_DIR/profile.json" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo '{}')
              DISPLAY_NAME=$(echo "$PROFILE" | jq -r '.name     // ""' 2>/dev/null || echo "")
              USERNAME=$(    echo "$PROFILE" | jq -r '.username // ""' 2>/dev/null || echo "")
            fi

            jq -n \
              --arg name "$REPO" \
              --arg disp "$DISPLAY_NAME" \
              --arg user "$USERNAME" \
              --arg desc "$REPO_DESC" \
              '{name:$name, display_name:$disp, username:$user, description:$desc}'
          done | jq -s '.' > repos.json

      - name: 推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新仓库列表 [skip ci]"
          git push
