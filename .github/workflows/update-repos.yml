name: 更新仓库列表

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: 生成 repos.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo list TwitterArchiver --limit 200 --json name \
            --jq '.[] | select(
              .name != "Dispatcher" and
              .name != ".github" and
              .name != "home" and
              .name != "TwitterArchiver.github.io"
            ) | .name' \
            | sort | while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue

            # profile.json 路径：accounts/{仓库名}/wayback_snapshots/profile.json
            PROFILE=$(gh api \
              "repos/TwitterArchiver/$REPO/contents/accounts/$REPO/wayback_snapshots/profile.json" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo '{}')

            DISP=$(echo "$PROFILE" | jq -r '.name     // ""' 2>/dev/null || echo "")
            USER=$(echo "$PROFILE" | jq -r '.username // ""' 2>/dev/null || echo "")
            BIO=$( echo "$PROFILE" | jq -r '.bio      // ""' 2>/dev/null | cut -c1-120 || echo "")

            jq -n \
              --arg repo "$REPO" \
              --arg name "$DISP" \
              --arg user "$USER" \
              --arg desc "$BIO" \
              '{repo:$repo, name:$name, username:$user, description:$desc}'
          done | jq -s '.' > repos.json

      - name: 推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repos.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 更新仓库列表 [skip ci]"
          git push
